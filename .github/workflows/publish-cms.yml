name: Pubblica contenuti Agorà e Magazine
on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - '.pages.yml'
      - 'assets/cinematic-agora.*'
      - 'assets/cinema-*.svg'
      - 'scripts/bundle-home-css.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pubblicazione-cms-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.repository == 'agorascuoladidialogosocratico-APS/Agor-aps-site'
    steps:
      - name: Scarica sito
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Installa dipendenze verificate
        run: npm ci --no-audit --no-fund
      - name: Genera copertine editoriali originali in PNG
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-editorial-covers.mjs
          node scripts/generate-editorial-covers-extra.mjs
          node scripts/generate-editorial-social.mjs
          python3 -m venv /tmp/agora-cover-venv
          /tmp/agora-cover-venv/bin/python -m pip install --quiet "CairoSVG==2.9.1" "Pillow==11.3.0"
          /tmp/agora-cover-venv/bin/python - <<'PY'
          from pathlib import Path
          import cairosvg
          for source in sorted(Path("assets/magazine/covers").glob("*.svg")):
              cairosvg.svg2png(url=str(source),write_to=str(source.with_suffix(".png")),output_width=1300,output_height=731)
          for source in sorted(Path("assets/magazine/contemporaneo").rglob("*.svg")):
              cairosvg.svg2png(url=str(source),write_to=str(source.with_suffix(".png")))
          PY
      - name: Ottimizza le immagini principali senza perdita visibile
        run: /tmp/agora-cover-venv/bin/python scripts/optimize-home-images.py
      - name: Genera e verifica il sito
        run: npm run build
      - name: Verifica metadati e provenienza SEO
        run: node scripts/verify-seo.mjs
      - name: Verifica regressioni di performance e immagini
        run: node scripts/verify-performance.mjs
      - name: Verifica esperienza WebGL accessibile
        run: node scripts/verify-immersion.mjs
      - name: Verifica nuove copertine e asset social
        run: node scripts/verify-editorial-social.mjs
      - name: Aggiorna pagine statiche dal CMS
        shell: bash
        run: |
          git config user.name "agora-editorial-bot"
          git config user.email "agora-editorial-bot@users.noreply.github.com"
          git add chi-siamo dialogo-socratico progetti tirocini volontariato-esc partecipa contatti trasparenza privacy accessibilita magazine sostienici sitemap.xml assets/magazine/covers assets/magazine/contemporaneo index.html assets/agora-home.css assets/image-optimization-manifest.json assets/agora_icon-144.webp assets/agora_dialogo*.webp assets/agora_gruppo_home*.webp assets/agora_viaggio*.webp assets/agora_chi_siamo*.webp
          if git diff --cached --quiet; then
            echo "Pagine già aggiornate."
            exit 0
          fi
          git commit -m "chore(cms): pubblica pagine e copertine originali Magazine"
          git push origin HEAD:main
