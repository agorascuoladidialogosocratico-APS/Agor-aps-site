name: Pubblica contenuti Agorà e Magazine
on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - '.pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pubblicazione-cms-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.repository == 'agorascuoladidialogosocratico-APS/Agor-aps-site'
    steps:
      - name: Scarica sito
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Installa dipendenze verificate
        run: npm ci --no-audit --no-fund
      - name: Genera e verifica il sito
        run: npm run build
      - name: Aggiorna pagine statiche dal CMS
        shell: bash
        run: |
          git config user.name "agora-editorial-bot"
          git config user.email "agora-editorial-bot@users.noreply.github.com"
          git add chi-siamo progetti tirocini volontariato-esc partecipa contatti trasparenza privacy accessibilita magazine sostienici sitemap.xml
          if git diff --cached --quiet; then
            echo "Pagine già aggiornate."
            exit 0
          fi
          git commit -m "chore(cms): pubblica contenuti e articoli Agorà Magazine [skip ci]"
          git push origin HEAD:main
