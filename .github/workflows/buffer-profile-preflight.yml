name: Preflight profili social Agorà (sola lettura)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/buffer-profile-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profiles:
    runs-on: ubuntu-latest
    steps:
      - name: Identifica i canali Buffer ufficiali
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {appendFileSync} from 'node:fs';
          const key=process.env.BUFFER_API_KEY;
          if(!key)throw Error('BUFFER_API_KEY assente');
          const request=async query=>{
           const response=await fetch('https://api.buffer.com',{method:'POST',
             headers:{'Content-Type':'application/json',Authorization:'Bearer '+key},
             body:JSON.stringify({query}),signal:AbortSignal.timeout(18000)});
           if(!response.ok)throw Error('Buffer HTTP '+response.status);
           const result=await response.json();
           if(result.errors?.length)throw Error('Buffer GraphQL: '+result.errors[0].message);
           return result.data;
          };
          const result=await request('query { account { organizations { id } } }');
          const orgs=result.account?.organizations||[];
          const channels=[];
          for(const org of orgs){
           const id=String(org.id||'');
           if(!/^[A-Za-z0-9:_-]{2,150}$/.test(id))throw Error('Organization ID Buffer errato');
           const query='query { channels(input: { organizationId: '+JSON.stringify(id)+' }) { name service isDisconnected isLocked } }';
           const values=(await request(query)).channels;
           if(!Array.isArray(values))throw Error('Canali non restituiti');
           channels.push(...values);
          }
          const rows=channels.filter(c=>['facebook','instagram'].includes(c.service));
          const lines=['## Profili utilizzabili per Agorà Magazine','','**Nessuna pubblicazione o bozza creata.**','','| Rete | Nome | Stato |','| --- | --- | --- |'];
          for(const c of rows){
           const clean=s=>String(s||'').replace(/[|<>\r\n]/g,' ').slice(0,160);
           const status=c.isDisconnected?'Disconnesso':c.isLocked?'Bloccato':'Collegato';
           lines.push('| '+clean(c.service)+' | '+clean(c.name)+' | '+status+' |');
           console.log(c.service+' | '+clean(c.name)+' | '+status);
          }
          if(!rows.length)throw Error('Nessun canale Facebook o Instagram');
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join('\n')+'\n');
          console.log('Canali Facebook/Instagram letti: '+rows.length);
          JS
