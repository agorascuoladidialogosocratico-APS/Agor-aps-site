name: Prova lettura HTML snapshot Wayback
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-wayback-html.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check-wayback-html.py
