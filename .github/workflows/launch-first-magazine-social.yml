name: Prima pubblicazione Agorà Magazine - Facebook e Instagram
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/launch-first-magazine-social.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: agora-magazine-buffer
  cancel-in-progress: false
jobs:
  publish-first-article:
    runs-on: ubuntu-latest
    if: github.repository == 'agorascuoladidialogosocratico-APS/Agor-aps-site'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pubblica subito sui due canali ufficiali verificati
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_FACEBOOK: ''
          BUFFER_CHANNEL_INSTAGRAM: ''
          BUFFER_CHANNEL_X: ''
        shell: bash
        run: |
          set -u
          status=0
          node scripts/social-buffer.mjs --execute --article benvenuti-in-agora-magazine --mode now --only facebook,instagram || status=$?
          git config user.name "agora-editorial-bot"
          git config user.email "agora-editorial-bot@users.noreply.github.com"
          git add data/buffer-posts.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(social): registra primo invio Facebook Instagram [skip ci]"
            git pull --rebase origin main || exit 1
            git push origin HEAD:main || exit 1
          fi
          exit "$status"
