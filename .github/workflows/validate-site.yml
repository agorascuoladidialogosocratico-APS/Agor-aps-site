name: Validate Agorà Studio build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler
        run: npm install --no-audit --no-fund
      - name: Verify static build
        run: npm run build
      - name: Validate Cloudflare Worker static assets
        run: npx wrangler deploy --dry-run --outdir .wrangler-check
      - name: Validate JavaScript syntax
        run: |
          node --check assets/site.js
          node --check assets/cms-runtime.js
          node --check assets/a11y.js
          node --check scripts/generate-pages.mjs
          node --check assets/experience.js
          node --check assets/contact-form.js
          node --check src/worker.js
          node --check assets/whatsapp-chat.js
          node --check assets/site-chat.js
          node --check assets/operator-chat.js
          node --check src/site-chat.js
