name: Verifica copie Wayback per articoli storici
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-filosofia-wayback.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wayback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check-filosofia-wayback.py
