name: Verifica connessione Buffer (senza pubblicare)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-buffer-connection.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Verifica API e canali collegati
    runs-on: ubuntu-latest
    steps:
      - name: Connessione Buffer in sola lettura
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {appendFileSync} from 'node:fs';
          const key=process.env.BUFFER_API_KEY;
          const summary=process.env.GITHUB_STEP_SUMMARY;
          const report=(title,rows=[],failed=false)=>{
            const markdown='## '+title+'\n\n'+rows.map(row=>'- '+row).join('\n')+'\n';
            appendFileSync(summary,markdown);
            console.log(title);
            for(const row of rows)console.log(row);
            if(failed)process.exitCode=1;
          };
          if(!key){
            report('Buffer: chiave non configurata',['Il secret BUFFER_API_KEY non è disponibile al workflow.'],true);
          }else{
            try{
              const request=async(query)=>{
                const response=await fetch('https://api.buffer.com',{
                  method:'POST',
                  headers:{'Content-Type':'application/json',Authorization:'Bearer '+key},
                  body:JSON.stringify({query}),
                  signal:AbortSignal.timeout(20000)
                });
                if(!response.ok)throw Error('API_HTTP_'+response.status);
                const result=await response.json();
                if(result.errors?.length)throw Error('GRAPHQL_ERROR');
                return result.data;
              };
              const account=await request('query { account { organizations { id } } }');
              const orgs=account?.account?.organizations;
              if(!Array.isArray(orgs))throw Error('NO_ORGANIZATIONS');
              const counts={facebook:0,instagram:0,twitter:0};
              let total=0;
              for(const org of orgs){
                const id=String(org.id||'');
                if(!/^[A-Za-z0-9:_-]{2,150}$/.test(id))throw Error('INVALID_ORG_ID');
                const query='query { channels(input: { organizationId: '+JSON.stringify(id)+' }) { service } }';
                const data=await request(query);
                if(!Array.isArray(data?.channels))throw Error('NO_CHANNEL_LIST');
                for(const channel of data.channels){
                  total++;
                  if(Object.hasOwn(counts,channel.service))counts[channel.service]++;
                }
              }
              const rows=[
                'Chiave API: riconosciuta da Buffer',
                'Organizzazioni accessibili: '+orgs.length,
                'Canali collegati complessivi: '+total,
                'Pagine Facebook: '+counts.facebook,
                'Account Instagram: '+counts.instagram,
                'Profili X/Twitter: '+counts.twitter,
                'Nessuna bozza, programmazione o pubblicazione effettuata'
              ];
              report('Buffer: verifica in sola lettura completata',rows);
            }catch(error){
              const category=String(error.message||'ERRORE').replace(/[^A-Z0-9_]/gi,'').slice(0,35);
              report('Buffer: verifica non completata',['Codice diagnostico: '+category,'Nessun post inviato.'],true);
            }
          }
          JS