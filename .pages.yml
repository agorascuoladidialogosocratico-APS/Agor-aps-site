# Agorà APS — editor per il sito GitHub + Cloudflare Pages
media:
  input: assets
  output: /assets
  rename: safe
  extensions:
  - png
  - jpg
  - jpeg
  - webp
content:
- name: identity
  label: 01 · Identità, logo e colori
  type: file
  operations:
    delete: false
  path: content/identity.json
  format: json
  fields:
  - name: name
    label: Nome breve associazione
    type: string
  - name: strapline
    label: Sottotitolo sotto il logo
    type: string
  - name: logo
    label: Logo nell’intestazione
    type: image
    description: Carica o scegli una fotografia autorizzata alla pubblicazione.
  - name: badgeLogo
    label: Logo nella sezione Chi siamo
    type: image
    description: Carica o scegli una fotografia autorizzata alla pubblicazione.
  - name: seo
    label: Titolo e descrizioni Google
    type: object
    fields:
    - name: title
      label: Titolo del sito
      type: string
    - name: description
      label: Descrizione per motori di ricerca
      type: text
    - name: shareImage
      label: Immagine di condivisione
      type: image
      description: Carica o scegli una fotografia autorizzata alla pubblicazione.
  - name: colors
    label: Colori del sito
    type: object
    fields:
    - name: petrol
      label: 'Blu petrolio (es. #193b4a)'
      type: string
    - name: terracotta
      label: 'Terracotta (es. #b85628)'
      type: string
    - name: ivory
      label: 'Avorio (es. #f8f0e6)'
      type: string
    - name: paper
      label: 'Sfondo chiaro (es. #fffaf5)'
      type: string
  - name: navCta
    label: Pulsante in alto
    type: object
    fields:
    - name: label
      label: Testo
      type: string
    - name: url
      label: Destinazione
      type: string
      description: 'Link interno (#progetti), https:// oppure mailto:'
  - name: footer
    label: Piè di pagina
    type: object
    fields:
    - name: tagline
      label: Descrizione breve
      type: string
    - name: copyright
      label: Copyright
      type: string
- name: home
  label: 02 · Homepage
  type: file
  operations:
    delete: false
  path: content/home.json
  format: json
  fields:
  - name: hero
    label: Copertina / Homepage
    type: object
    fields:
    - name: eyebrow
      label: Sopratitolo
      type: string
    - name: line1
      label: 'Titolo: prima riga'
      type: string
    - name: line2
      label: 'Titolo: seconda riga'
      type: string
    - name: accent
      label: 'Titolo: parola evidenziata'
      type: string
    - name: description
      label: Testo principale
      type: text
    - name: buttonText
      label: Testo pulsante principale
      type: string
    - name: buttonLink
      label: Destinazione pulsante
      type: string
      description: 'Link interno (#progetti), https:// oppure mailto:'
    - name: secondaryText
      label: Testo pulsante secondario
      type: string
    - name: secondaryLink
      label: Destinazione secondaria
      type: string
      description: 'Link interno (#progetti), https:// oppure mailto:'
    - name: footnote
      label: Tre parole chiave
      type: string
    - name: image
      label: Grande fotografia principale
      type: image
      description: Carica o scegli una fotografia autorizzata alla pubblicazione.
    - name: imageAlt
      label: Descrizione accessibile fotografia
      type: text
    - name: imageCaptionTop
      label: Didascalia principale
      type: string
    - name: imageCaptionBottom
      label: Didascalia secondaria
      type: string
  - name: values
    label: Ambiti di attività — riordinabili
    type: object
    fields:
    - name: symbol
      label: Simbolo
      type: string
    - name: title
      label: Ambito
      type: string
    list:
      collapsible:
        collapsed: true
        summary: '{index}'
